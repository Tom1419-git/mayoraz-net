name: Relevé d'indexation

# Chaque lundi 06:00 UTC (07:00/08:00 en Suisse) : combien de pages Google et
# Bing ont réellement indexées, page par page. Résultat dans le résumé du run.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Relevé Google Search Console et Bing Webmaster
        run: python3 scripts/indexation-report.py --sa-b64-env GCLOUD_INDEXING_SA
        env:
          GCLOUD_INDEXING_SA: ${{ secrets.GCLOUD_INDEXING_SA }}
          # Facultatif : sans cette clé, la colonne Bing indique « non configuré ».
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
