name: CI

on:
  push:
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Historique complet : le sitemap calcule le lastmod de chaque page
          # depuis la date de son dernier commit (clone superficiel = pas de dates).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

  deploy-cloudflare:
    needs: build-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Historique complet : le sitemap calcule le lastmod de chaque page
          # depuis la date de son dernier commit (clone superficiel = pas de dates).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Write build info
        run: node scripts/write-build-info.mjs

      - name: Deploy to Cloudflare Workers
        run: npx wrangler@4.148.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  notify-google:
    needs: deploy-cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Historique complet : le sitemap calcule le lastmod de chaque page
          # depuis la date de son dernier commit (clone superficiel = pas de dates).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site (génère dist/sitemap-0.xml lu localement par le notifier)
        run: npm run build

      - name: Notifier Google et IndexNow (pages modifiées uniquement)
        run: python3 scripts/notify-google.py --sa-b64-env GCLOUD_INDEXING_SA --since-sha "$BEFORE_SHA" --indexnow-key "$INDEXNOW_KEY"
        env:
          GCLOUD_INDEXING_SA: ${{ secrets.GCLOUD_INDEXING_SA }}
          # Commit déployé avant celui-ci : sert à ne notifier que les pages touchées.
          BEFORE_SHA: ${{ github.event.before }}
          INDEXNOW_KEY: 11be82e6da27b651cc86628e67d9ec60

      - name: Re-soumettre le sitemap GSC (canal de découverte passif)
        continue-on-error: true
        run: python3 scripts/gsc_sitemaps.py --sa-b64-env GCLOUD_INDEXING_SA
        env:
          GCLOUD_INDEXING_SA: ${{ secrets.GCLOUD_INDEXING_SA }}
